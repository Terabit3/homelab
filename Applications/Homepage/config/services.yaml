---
- Server Management:
    - Servius TrueNAS:
        icon: truenas.png
        href: "{{HOMEPAGE_VAR_TRUENAS_URL}}"
        ping: "{{HOMEPAGE_VAR_TRUENAS_URL_2}}"
        statusStyle: 'basic'
        description: "ZFS-powered storage with advanced data protection"
        widget:
          type: truenas
          url: "{{HOMEPAGE_VAR_TRUENAS_URL_2}}"
          key: "{{HOMEPAGE_VAR_TRUENAS_API_KEY}}"
          enablePools: true
          nasType: scale
    
