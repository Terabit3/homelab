- Network Services:
    - ASUS RT-AX82U Router:
        icon: asus.png
        href: "{{HOMEPAGE_VAR_ASUSROUTER_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_ASUSROUTER_URL}}"
        description: ASUS Router management interface

    - Pi-hole (Primary):
        icon: pi-hole.svg
        href: "{{HOMEPAGE_VAR_PIHOLE_HOMEPI_URL}}"
        siteMonitor : "{{HOMEPAGE_VAR_PIHOLE_HOMEPI_URL_2}}"
        statusStyle: 'basic'
        description: Primary DNS server on Raspberry Pi 3+
        widget:
            type: pihole
            url: "{{HOMEPAGE_VAR_PIHOLE_HOMEPI_URL_2}}"
            version: 6
            key: "{{HOMEPAGE_VAR_PIHOLE_HOMEPI_API_KEY}}"

    - Pi-hole (Secondary):
        icon: pi-hole.svg
        href: "{{HOMEPAGE_VAR_PIHOLE_SERVIUS_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_PIHOLE_SERVIUS_URL_2}}"
        description: Secondary DNS server on Servius
        widget:
            type: pihole
            url: "{{HOMEPAGE_VAR_PIHOLE_SERVIUS_URL_2}}"
            version: 6
            key: "@Pure72598TH"

    - Nginx Proxy Manager:
        icon: nginx.png
        href: "{{HOMEPAGE_VAR_NGINX_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_NGINX_URL_2}}"
        description: Web-based tool for reverse proxy, SSL, and domain management
        widget:
            type: npm
            url: "{{HOMEPAGE_VAR_NGINX_URL_2}}"
            username: "{{HOMEPAGE_VAR_NGINX_USERNAME}}"
            password: "{{HOMEPAGE_VAR_NGINX_PASSWORD}}"

