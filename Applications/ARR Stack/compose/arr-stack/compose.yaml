services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - arr-stack_shared
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/Edmonton
    volumes:
      - ./prowlarr/:/config
      - ${MEDIA_PATH}:/media/ # Use the MEDIA_PATH variable
    ports:
      - 9696:9696
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks:
      - arr-stack_shared
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/Edmonton
    volumes:
      - ./radarr/:/config
      - ${MEDIA_PATH}:/media # Use the MEDIA_PATH variable
    ports:
      - 7878:7878
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - arr-stack_shared
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/Edmonton
    volumes:
      - ./sonarr/:/config
      - ${MEDIA_PATH}:/media # Use the MEDIA_PATH variable
    ports:
      - 8989:8989
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    networks:
      - arr-stack_shared
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=America/Edmonton
    ports:
      - 8191:8191
    restart: unless-stopped
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    networks:
      - arr-stack_default
      - arr-stack_shared
    environment:
      - TZ=America/Edmonton
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=10.136.201.89/32
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - FIREWALL_VPN_INPUT_PORTS=6881,37410
    volumes:
      - ./gluetun/:/config
      - /mnt/speedpool/appdata/stacks/arr-stack/gluetun/:/gluetun
    ports:
      - 8080:8080
      - 6881:6881/udp
      - 6881:6881/tcp
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    depends_on:
      - gluetun
    environment:
      - PUID=568
      - PGID=568
      - TZ=America/Edmonton
      - WEBUI_PORT=8080
    network_mode: service:gluetun
    volumes:
      - ./qbit/:/config
      - ${MEDIA_PATH}:/media
    restart: unless-stopped
networks:
  arr-stack_shared:
    external: true
  arr-stack_default:
    external: true
